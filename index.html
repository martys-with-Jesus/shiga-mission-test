abel for="password">비밀번호</label><input autocomplete="current-password" id="password" type="password"/></div><button class="action" id="loginBtn">로그인</button></div><div class="hidden" id="loggedIn"><div class="actions"><button class="action secondary" id="logoutBtn">로그아웃</button><button class="action" id="addBtn">새 항목 추가</button></div><div class="field"><label>편집할 메뉴</label><select id="editType"><option value="schedule">선교 일정</option><option value="songs">찬양 연습실</option><option value="phrases">일본어 회화</option><option value="prayers">기도 제목</option></select></div><div id="editList"></div><div class="hidden" id="editorBox" style="margin-top:18px;padding:18px;border:1px solid #cbd8d2;border-radius:16px;background:#fff"><h3 id="editorTitle">항목 편집</h3><div class="field"><label for="itemTitle">제목 / 일본어 문장</label><input id="itemTitle" maxlength="250" type="text"/></div><div class="field"><label for="itemBody">내용 / 일정 / 한국어 뜻</label><textarea id="itemBody" maxlength="20000" rows="5"></textarea></div><div class="hidden" id="songFields"><div class="field"><label for="itemJapanese">일본어 가사</label><textarea id="itemJapanese" rows="5"></textarea></div><div class="field"><label for="itemPronunciation">한글 발음</label><textarea id="itemPronunciation" rows="5"></textarea></div><div class="field"><label for="itemKorean">한국어 가사</label><textarea id="itemKorean" rows="5"></textarea></div><div id="songPartsEditor"></div><div class="field"><label for="itemAudio">음원 URL (선택)</label><input id="itemAudio" placeholder="https://..." type="url"/></div><div class="field"><label for="audioFile">음원 파일 업로드 (MP3, M4A 등 · 최대 30MB)</label><input accept="audio/*" id="audioFile" type="file"/></div><div class="field"><label for="itemScore">악보 URL (선택)</label><input id="itemScore" placeholder="https://..." type="url"/></div></div><p id="editorStatus" class="status" role="status" aria-live="polite"></p><div class="actions"><button class="action" id="saveItem" type="button">Firebase에 저장</button><button class="act <script>
const SEED={
 schedule:[['DAY 01 · 11월 12일 (목)','오후 · 팀 집결 및 이동\n16:00 · 렌터카 픽업 후 고카 이동\n20:00 · 구모이 그리스도 복음교회 기도회'],['DAY 02 · 11월 13일 (금)','오전·오후 · 전도 및 현지 방문\n19:30 · 고카 그리스도 복음교회 기도회'],['DAY 03 · 11월 14일 (토)','오전 · 은혜와 진리교회 한국 문화 교류 (현지 약 10명)\n오후 · 자유 시간 및 교제'],['DAY 04 · 11월 15일 (일)','10:00 · 고카 그리스도 복음교회 연합예배 및 세례식 예정\n점심 식사 후 공항 이동\n16:00경 · 공항 도착 예정']],
 songs:[['예수로 나의 구주 삼고',''],['여호와께 돌아가자',''],['나 같은 죄인 살리신',''],['꽃들도',''],['더 원합니다 (예수 사랑합니다)',''],['예배하는 자 되어','']],
 phrases:[['はじめまして。','하지메마시테 · 처음 뵙겠습니다.'],['お会いできてうれしいです。','오아이데키테 우레시이데스 · 만나서 반갑습니다.'],['ありがとうございます。','아리가토- 고자이마스 · 감사합니다.'],['イエス様を知っていますか。','이에스사마오 싯테이마스카 · 예수님을 아시나요?']],
 prayers:[['일본 땅을 위해','복음을 들을 수 있는 마음을 허락해 주세요.'],['선교팀을 위해','하나님을 기대하고 경험하는 선교가 되게 해 주세요.'],['현지 교회와 선교사님을 위해','하나님 보시기에 좋은 연합이 이루어지게 해 주세요.']]
};
const TYPES=['schedule','songs','phrases','prayers'];
const META={schedule:['SCHEDULE','선교 일정','11월 12–15일 · 현장 상황에 따라 변동될 수 있습니다.'],songs:['WORSHIP','찬양 연습실','일본어 가사 · 한글 발음 · 한국어 뜻 · 음원'],phrases:['JAPANESE','일본어 회화','인사 · 일상 · 복음'],prayers:['PRAYER','기도 제목','함께 중보하기']};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=x=>/^https:\/\/[^\s]+$/i.test(String(x||''))?x:'';
let records=[],current='home',ready=false,failed=false;
function visible(type){const saved=records.filter(x=>x.type===type);const base=SEED[type].map(([title,body],i)=>({id:'seed_'+type+'_'+i,type,title,body,order:i,seed:true}));const hidden=new Set(saved.filter(x=>x.deleted).map(x=>x.id));const map=new Map(base.map(x=>[x.id,x]));for(const x of saved){if(!x.deleted)map.set(x.id,x);else map.delete(x.id)}return [...map.values()].filter(x=>!hidden.has(x.id)).sort((a,b)=>(a.order??9999)-(b.order??9999));}
function scheduleRows(body){return String(body||'').split(/\n+/).filter(line=>line.trim()).map(line=>{const match=line.match(/^\s*(오전[·\s]*오후|오전|오후|점심|저녁|\d{1,2}:\d{2}(?:경)?|\d{1,2}시(?:\s*\d{1,2}분)?(?:경)?)\s*[·:：-]\s*(.+)$/);return match?`<div class="schedule-row"><span class="schedule-time">${esc(match[1].replace(/\s+/g,' '))}</span><span class="schedule-event">${esc(match[2])}</span></div>`:`<div class="schedule-row"><span class="schedule-time schedule-time-empty"></span><span class="schedule-event">${esc(line.trim())}</span></div>`}).join('')}
let selectedSongId=null;
const SONG_PARTS=[['verse1','1절'],['verse2','2절'],['chorus','후렴'],['bridge','브릿지']];
function renderSongDetail(x){
 // GitHub Pages audio files: audio/song_01.mp3 ... audio/song_06.mp3.
 // Explicit Firebase audioURL takes priority if set by the administrator.
 const songIndex=SEED.songs.findIndex(([title])=>title===x.title);
 const githubAudio=songIndex>=0?`./audio/song_${String(songIndex+1).padStart(2,'0')}.mp3`:'';
 const audio=safeURL(x.audioURL)||githubAudio,score=safeURL(x.scoreURL);
 const hasParts=x.parts&&Object.values(x.parts).some(p=>p&&(p.japanese||p.pronunciation||p.korean));
 const blocks=hasParts?SONG_PARTS.filter(([key])=>{const p=x.parts[key];return p&&(p.japanese||p.pronunciation||p.korean)}).map(([key,label])=>{
  const p=x.parts[key];return `<section class="song-part"><h4>${label}</h4>${[['japanese','일본어 가사'],['pronunciation','한국어 발음'],['korean','한국어 뜻']].map(([field,heading])=>`<div class="lyric-line"><span class="lyric-label">${heading}</span><div class="detail">${p[field]?esc(p[field]):'<span class="notice">미등록</span>'}</div></div>`).join('')}</section>`;
 }).join(''):[`<p class="notice">절별 가사를 아직 등록하지 않았습니다. 관리자가 1절·2절·후렴·브릿지별로 입력할 수 있습니다.</p>${[['japanese','일본어 가사 (기존)'],['pronunciation','한국어 발음 (기존)'],['korean','한국어 뜻 (기존)']].filter(([k])=>x[k]).map(([k,label])=>`<div class="song-section"><strong>${label}</strong><div class="detail">${esc(x[k])}</div></div>`).join('')}`].join('');
 return `<div class="song-detail"><button class="song-detail-back" id="songListBack" type="button">← 찬양 목록으로</button><article class="card"><div class="tag">WORSHIP · SONG</div><h3>${esc(x.title)}</h3><div class="song-section"><strong>음원 듣기</strong>${audio?`<audio class="song-audio" controls preload="none" src="${esc(audio)}"></audio>`:'<p class="notice">등록된 음원이 없습니다.</p>'}</div>${blocks}${score?`<div class="song-section"><a href="${esc(score)}" target="_blank" rel="noopener noreferrer">악보 보기 ↗</a></div>`:''}</article></div>`;
}

function render(type=current){
 current=type;const home=type==='home';$('home').classList.toggle('hidden',!home);$('page').classList.toggle('hidden',home);if(home)return;
 const [label,title,desc]=META[type];$('pageLabel').textContent=label;$('pageTitle').textContent=title;$('pageDesc').textContent=desc;
 const list=window.SHIGA.visible(type);
 if(type==='songs'){
  const song=selectedSongId&&list.find(x=>x.id===selectedSongId);
  if(selectedSongId&&!song)selectedSongId=null;
