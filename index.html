try{const app=initializeApp(config);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);onSnapshot(collection(db,col),snap=>{rows=snap.docs.map(d=>({id:d.id,...d.data()}));window.SHIGA.visible=type=>{const base=window.SHIGA.SEED[type].map(([title,body],i)=>({id:`seed_${type}_${i}`,type,title,body,order:i}));const map=new Map(base.map(x=>[x.id,x]));for(const x of rows.filter(x=>x.type===type)){if(x.deleted)map.delete(x.id);else map.set(x.id,x);}return [...map.values()].sort((a,b)=>(a.order??9999)-(b.order??9999));};window.SHIGA.render();if(user)editList();},e=>status('데이터 읽기 오류: '+(e.code||e.message)+' · 기본 일정은 표시됩니다.'));onAuthStateChanged(auth,u=>{user=u;$('loginForm').classList.toggle('hidden',!!u);$('loggedIn').classList.toggle('hidden',!u);status(u?'관리자 로그인 완료 · 편집 후 저장할 수 있습니다.':'관리자 로그인 후 편집할 수 있습니다.');if(u)editList();});$('loginBtn').onclick=async()=>{try{status('로그인 중…');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';}catch(e){status('로그인 실패: '+(e.code||e.message));}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logoutBtn').onclick=()=>signOut(auth);$('addBtn').onclick=()=>openEdit();$('editType').onchange=()=>{$('editorBox').classList.add('hidden');editList()};$('saveItem').onclick=save;$('cancelItem').onclick=()=>$('editorBox').classList.add('hidden');}catch(e){status('Firebase 초기화 실패: '+e.message)}
</script></body></html>
